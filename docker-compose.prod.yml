# Reference template for a single-VM Docker deployment — adapt to whatever the
# deployment team actually provisions (this is not wired to real secrets or a live host).
# Postgres is NOT included here: production DB is Supabase (see docs/deployment.md).
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production   # not committed — see docs/deployment.md
    volumes:
      - backend_uploads:/app/uploads
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    ports:
      - "8005:8005"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: https://api.your-domain.example/api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
